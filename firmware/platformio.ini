; ESP32 Otomatik Lastik Şişirme İstasyonu
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
board_build.partitions = min_spiffs.csv
; İleride tahliye valfi (GPIO26) takılınca aşağıdaki satırın başındaki ';' kaldır
;build_flags = -DTAHLIYE_VALFI=1

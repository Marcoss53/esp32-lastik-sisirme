; ESP32 Tire Inflator / Otomatik Lastik Şişirme İstasyonu
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
; İleride tahliye valfi (GPIO26) takılınca aşağıdaki satırın başındaki ';' kaldır
;build_flags = -DTAHLIYE_VALFI=1
